apiVersion: 2023-05-01
kind: Job
name: ermozhi-job-reconciliation
location: centralindia
identity:
  type: SystemAssigned
properties:
  environmentId: /subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP}/providers/Microsoft.App/managedEnvironments/${ACA_ENVIRONMENT_NAME}
  configuration:
    triggerType: Schedule
    scheduleTriggerConfig:
      cronExpression: "*/15 * * * *"
    replicaTimeout: 300
    replicaRetryLimit: 1
    secrets:
      - name: gemini-api-key
        keyVaultUrl: https://${KEY_VAULT_NAME}.vault.azure.net/secrets/gemini-api-key
        identity: system
      - name: meta-access-token
        keyVaultUrl: https://${KEY_VAULT_NAME}.vault.azure.net/secrets/meta-access-token
        identity: system
  template:
    containers:
      - name: reconciliation-runner
        image: ${ACR_NAME}.azurecr.io/ermozhi-worker:${IMAGE_TAG}
        command: ["python", "-m", "src.worker.jobs.reconciliation"]
        resources:
          cpu: 0.5
          memory: 1.0Gi
        env:
          - name: ENVIRONMENT
            value: "production"
          - name: STORAGE_ACCOUNT_NAME
            value: "${STORAGE_ACCOUNT_NAME}"
          - name: GEMINI_API_KEY
            secretRef: gemini-api-key
          - name: META_ACCESS_TOKEN
            secretRef: meta-access-token
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
