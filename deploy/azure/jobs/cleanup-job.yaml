apiVersion: 2023-05-01
kind: Job
name: ermozhi-job-media-cleanup
location: centralindia
identity:
  type: SystemAssigned
properties:
  environmentId: /subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP}/providers/Microsoft.App/managedEnvironments/${ACA_ENVIRONMENT_NAME}
  configuration:
    triggerType: Schedule
    scheduleTriggerConfig:
      cronExpression: "0 2 * * *"
    replicaTimeout: 600
    replicaRetryLimit: 1
  template:
    containers:
      - name: cleanup-runner
        image: ${ACR_NAME}.azurecr.io/ermozhi-worker:${IMAGE_TAG}
        command: ["python", "-m", "src.worker.jobs.cleanup"]
        resources:
          cpu: 0.25
          memory: 0.5Gi
        env:
          - name: ENVIRONMENT
            value: "production"
          - name: STORAGE_ACCOUNT_NAME
            value: "${STORAGE_ACCOUNT_NAME}"
          - name: RETENTION_DAYS
            value: "30"
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
